<header class="d-flex justify-content-between align-items-center px-5">
  <img
    src="images/info-logo.png"
    alt="Logo da Info"
    class="logo"
    [routerLink]="['']"
    role="button"
  >

  <div class="d-flex gap-3 fw-semibold fs-5 text-white">
    <span
      class="nav-link"
      [routerLink]="['/']"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      role="button"
    >
      HOME
    </span>

    <span
      class="nav-link"
      [routerLink]="['/registry']"
      routerLinkActive="active"
      role="button"
    >
      CADASTRO
    </span>
  </div>
</header>
