<header class="d-flex justify-content-between align-items-center px-5">
  <a href="https://infosistemas.com.br/" target="_blank" rel="noopener noreferrer">
    <img
      src="images/info-logo.png"
      alt="Logo da Info"
      class="logo"
      role="button"
    >
  </a>

  <div class="d-flex gap-3 fw-semibold fs-5 text-white">
    <span
      class="nav-link"
      [routerLink]="['/']"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      role="button"
    >
      DASHBOARD
    </span>

    <span
      class="nav-link"
      [routerLink]="['/registry']"
      routerLinkActive="active"
      role="button"
    >
      CADASTRO
    </span>
  </div>
</header>
